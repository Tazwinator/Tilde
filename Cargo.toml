[workspace]
members = ["src-tauri", "crates/tilde-core", "crates/tilde-pipeline"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
regex = "1"
thiserror = "2"
