[workspace]
members = ["src-tauri", "crates/tilde-core", "crates/tilde-pipeline"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
regex = "1"
zip = { version = "6", default-features = false, features = ["deflate"] }

# Profiles only take effect here, at the workspace root (Cargo ignored them
# in src-tauri/Cargo.toml). Smaller, faster release binaries; panics still
# unwind, so one failing command can't take the whole app down with it.
[profile.release]
codegen-units = 1
lto = true
strip = true
