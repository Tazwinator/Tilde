[package]
name = "tilde-pipeline"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "tilde-pipeline"
path = "src/main.rs"

[dependencies]
tilde-core = { path = "../tilde-core" }
serde = { workspace = true }
serde_json = { workspace = true }
rusqlite = { workspace = true }
ureq = { version = "3", features = ["gzip"] }
zip = { workspace = true }
flate2 = "1"
sha2 = "0.10"
