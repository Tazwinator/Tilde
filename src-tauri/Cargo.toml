[package]
name = "tilde"
version = "0.1.0"
description = "Tilde — a playful, zero-pressure Spanish trainer"
authors = ["Tazwinator"]
edition = "2021"
license = "MIT"

[lib]
name = "tilde_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tilde-core = { path = "../crates/tilde-core" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
rusqlite = { workspace = true, features = ["backup", "hooks"] }
fsrs = "6"
base64 = "0.22"
sha1 = "0.10"
zip = { workspace = true }
chrono = "0.4"
hex = "0.4.3"

# Desktop only (the plugin has no mobile side). Pinned to 2.4: 2.5 needs
# tauri 2.12, which would move the whole tauri stack.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "~2.4"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
